<section id="community"
    class="relative bg-[#0d1b2e] min-h-[80vh] text-white py-12 px-6 sm:px-10 lg:px-16 flex items-center">
    <div class="flex flex-col lg:flex-row items-center justify-between max-w-6xl gap-6 xl:gap-16 mx-auto w-full pt-0">

        <div class="flex flex-col w-full">

            <div appScrollReveal="up" class="mb-6">
                <img src="/angularph.png" alt="Angular PH Logo" class="w-44 md:w-52" />
            </div>

            <div appScrollReveal="up" [revealDelay]="100" class="flex flex-col sm:flex-row sm:items-center gap-6 mb-8">
                <h1 class="text-2xl md:text-4xl font-bold whitespace-nowrap">Angular PH</h1>
                <a href="https://angular-ph.org" target="_blank"
                    class="text-base text-[#cdd9e5] border border-tertiary-100 rounded-xl hover:bg-gray-700 focus:ring-4 focus:ring-gray-80 px-8 py-3 transition-colors w-fit">
                    https://angular-ph.org
                </a>
            </div>

            <p appScrollReveal="up" [revealDelay]="180" class="text-[#cdd9e5] text-sm sm:text-base lg:text-lg leading-relaxed mb-9">{{ 'community.body' | translate }}</p>

            <div appScrollReveal="zoom" [revealDelay]="260" class="flex items-center gap-5">
                <a [href]="signInUrl"
                    class="bg-[#1b99f4] hover:bg-[#0d8ae0] text-white font-semibold px-10 py-3 rounded-lg transition-colors inline-flex items-center justify-center">
                    {{ 'community.join' | translate }}
                </a>
                <img src="/rocket.png" alt="Rocket" class="w-20" />
            </div>

        </div>

        <div class="relative flex flex-col w-full items-center mt-5 sm:mt-28 lg:mt-0">

            <div appScrollReveal="right" [revealDelay]="120" class="relative w-full sm:w-[416px] sm:h-[250px] sm:ml-28">
                <div class="hidden sm:block absolute -top-[118px] -right-7">
                    <img src="/astronaut-book.png" alt="Astronaut" class="w-40" />
                </div>
                <img src="/featured-3 1.png" alt="Community members"
                    class="object-cover rounded-xl w-full h-[200px] sm:h-[250px] shadow-lg" />
            </div>

            <div appScrollReveal="right" [revealDelay]="240" class="w-full sm:w-[333px] sm:h-[200px] mt-5 sm:-mt-14 sm:mr-40 sm:z-0">
                <img src="/featured-2 1.png" alt="Community event"
                    class="object-cover rounded-xl w-full h-[200px] shadow-lg" />
            </div>

        </div>

    </div>
</section>
