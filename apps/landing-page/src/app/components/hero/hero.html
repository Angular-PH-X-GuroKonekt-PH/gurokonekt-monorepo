<section class="bg-gray-900">
  <div class="flex">
    <div class="grid max-w-screen-xl px-4 py-8 mx-auto lg:gap-8 xl:gap-0 lg:py-16 lg:grid-cols-12">
      <div class="mr-auto place-self-center lg:col-span-5">
        <h1
          appScrollReveal="left"
          class="max-w-2xl mb-4 text-3xl font-extrabold tracking-tight leading-tight sm:text-4xl md:text-5xl xl:text-5xl text-white"
        >
          {{ 'hero.title' | translate }}
        </h1>
        <p
          appScrollReveal="left"
          [revealDelay]="120"
          class="max-w-2xl mb-6 font-light text-[#C0D9FF] lg:mb-8 md:text-lg lg:text-xl"
        >
          {{ 'hero.subtitle' | translate }}
        </p>
        <div appScrollReveal="zoom" [revealDelay]="240" class="flex">
          <a [href]="signInUrl" class="inline-flex items-center justify-center px-5 py-3 mr-3 text-base font-medium text-center text-white border border-tertiary-100 rounded-xl hover:bg-gray-700 focus:ring-4 focus:ring-gray-800">
            {{ 'hero.join' | translate }}
          </a>
          <a routerLink="/mission" class="inline-flex items-center justify-center px-5 py-3 text-base font-medium text-center text-white border border-tertiary-100 rounded-xl hover:bg-gray-700 focus:ring-4 focus:ring-gray-800">
            <img
              src="logo.svg"
              alt="GuroKonekt Logo"
              class="w-6 h-6 ml-2 mr-1"
            />
            {{ 'hero.about' | translate }}
          </a>
        </div>
      </div>
      <div appScrollReveal="right" [revealDelay]="180" class="sm:my-8 md:my-12 xs:my-6 lg:mt-0 lg:col-span-7 lg:flex">
        <!-- # TODO: Make SVG or the image bigger -->
        <img src="hero.png" class="w-full h-full" alt="mockup">
      </div>
    </div>
  </div>
</section>
