<section id="about" class="w-full min-h-[70vh] bg-[#131e31] flex items-center justify-center py-3">
  <div class="flex flex-col md:flex-row items-center md:items-start max-w-5xl w-full gap-10 px-4">
    <div appScrollReveal="left" class="flex justify-center items-center md:min-h-[400px] flex-shrink-0">
      <img src="/astronaut-book.png" alt="Astronaut reading book" class="w-[400px] max-w-full block" />
    </div>
    <div class="flex flex-col gap-4 text-white w-full">
      <h2 appScrollReveal="up" class="text-4xl font-bold mb-1">{{ 'about.title' | translate }}</h2>
      <h3 appScrollReveal="up" [revealDelay]="80" class="text-2xl font-semibold flex items-center gap-1 mb-2">
        {{ 'about.heading' | translate }}
        <img src="/spaceship.png" alt="Rocket" class="w-12 h-12 inline-block align-middle" style="transform: rotate(-36.5deg);" />
      </h3>
      <p appScrollReveal="up" [revealDelay]="140" class="text-sm sm:text-base lg:text-lg leading-relaxed">
        {{ 'about.body1' | translate }}
      </p>
      <p appScrollReveal="up" [revealDelay]="220" class="text-sm sm:text-base lg:text-lg leading-relaxed">
        {{ 'about.body2' | translate }}
      </p>
      <div appScrollReveal="zoom" [revealDelay]="300" class="mt-6">
        <div class="bg-[#181f2e] rounded-xl flex items-center gap-3 px-3 py-5 shadow-lg max-w-[250px]">
          <img src="/angularph.png" alt="Angular PH" class="w-14 h-auto" />
          <div class="text-white">
            <b>Angular PH</b><br />
            <span class="text-sm">{{ 'about.cardLabel' | translate }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
