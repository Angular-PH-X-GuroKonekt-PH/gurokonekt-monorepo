<div class="mb-6 sm:mb-10">
  <div class="flex items-start justify-center max-w-4xl mx-auto">
    @for (stepTitle of stepTitles(); track $index) {
    <div class="flex flex-col items-center relative" [style.flex]="1">
      <div
        class="relative flex h-9 w-9 items-center justify-center rounded-full border-2 sm:h-14 sm:w-14 transition-all duration-300 z-10 bg-white"
        [class]="
          currentStep() > $index + 1
            ? 'border-green-500 text-green-600'
            : currentStep() === $index + 1
              ? 'border-orange-500 bg-white text-orange-500 shadow-lg'
              : 'border-gray-300 text-gray-700'
        "
        (click)="stepSelected.emit($index + 1)"
        (keyup.enter)="stepSelected.emit($index + 1)"
        (keyup.space)="stepSelected.emit($index + 1)"
        [attr.tabindex]="canNavigate()($index + 1) ? '0' : '-1'"
        [attr.role]="'button'"
        [attr.aria-label]="'Go to step ' + ($index + 1) + ': ' + stepTitle"
        [class.cursor-pointer]="canNavigate()($index + 1)"
      >
        @if (currentStep() > $index + 1) {
        <app-icon name="check-mark" class="h-4 w-4 text-green-600 sm:h-6 sm:w-6"></app-icon>
        } @else {
        <span class="text-sm font-extrabold sm:text-lg">{{ $index + 1 }}</span>
        }
      </div>

      @if ($index < stepTitles().length - 1) {
      <div
        class="absolute left-1/2 top-[17px] -z-10 h-0.5 w-full sm:top-[27px]"
        [class]="currentStep() > $index + 1 ? 'bg-green-500' : 'bg-gray-200'"
        style="transform: translateX(50%)"
      ></div>
      }

      <div class="mt-2 max-w-32 px-0.5 text-center sm:mt-4">
        <h3
          class="mb-1 text-[11px] font-semibold leading-tight sm:text-sm"
          [class]="
            currentStep() === $index + 1
              ? 'text-orange-600'
              : currentStep() > $index + 1
                ? 'text-green-600'
                : 'text-gray-500'
          "
        >
          {{ stepTitle }}
        </h3>
        <p class="hidden text-xs leading-relaxed text-gray-500 md:block">
          {{ stepDescriptions()[$index] }}
        </p>
      </div>
    </div>
    }
  </div>
</div>
