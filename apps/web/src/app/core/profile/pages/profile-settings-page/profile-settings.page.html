<section class="min-h-screen bg-linear-to-br from-blue-50 via-orange-50/80 to-slate-50 py-8 sm:py-12">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <header class="mb-8">
      <a
        [routerLink]="dashboardRoute"
        class="mb-6 inline-flex items-center gap-1.5 text-sm font-medium text-blue-700 transition-colors hover:text-blue-900"
      >
        <app-icon name="chevron-left" class="h-4 w-4"></app-icon>
        Back to Dashboard
      </a>

      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
            Profile Settings
          </h1>
          <p class="mt-2 max-w-xl text-base text-slate-600">
            Review your account identity and update your profile details.
          </p>
        </div>
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-[280px_1fr] lg:items-start">
      <aside
        class="overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm lg:sticky lg:top-6"
      >
        <nav class="flex flex-col gap-1.5 p-3" aria-label="Profile settings sections">
          @for (section of sections; track section.route) {
            <a
              [routerLink]="section.route"
              routerLinkActive
              #sectionNav="routerLinkActive"
              [attr.aria-current]="sectionNav.isActive ? 'page' : null"
              class="group relative flex items-center gap-3.5 overflow-hidden rounded-xl px-3.5 py-3.5 text-base transition-colors duration-150"
              [class.bg-orange-50]="sectionNav.isActive"
              [class.text-orange-800]="sectionNav.isActive"
              [class.text-slate-600]="!sectionNav.isActive"
              [class.hover:bg-slate-50]="!sectionNav.isActive"
              [class.hover:text-slate-900]="!sectionNav.isActive"
            >
              <span
                class="absolute inset-y-2.5 left-0 w-1 rounded-full transition-opacity duration-150"
                [class.bg-orange-500]="sectionNav.isActive"
                [class.opacity-100]="sectionNav.isActive"
                [class.opacity-0]="!sectionNav.isActive"
                aria-hidden="true"
              ></span>

              <span
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl transition-colors duration-150"
                [class.bg-orange-100]="sectionNav.isActive"
                [class.text-orange-600]="sectionNav.isActive"
                [class.bg-slate-100]="!sectionNav.isActive"
                [class.text-slate-500]="!sectionNav.isActive"
                [class.group-hover:bg-slate-200/70]="!sectionNav.isActive"
                [class.group-hover:text-slate-700]="!sectionNav.isActive"
              >
                <app-icon [name]="section.icon" class="h-5 w-5"></app-icon>
              </span>

              <span class="min-w-0 flex flex-col gap-0.5">
                <span
                  class="truncate font-semibold leading-tight"
                  [class.text-orange-800]="sectionNav.isActive"
                  [class.text-slate-800]="!sectionNav.isActive"
                >
                  {{ section.label }}
                </span>
                <span
                  class="truncate text-sm font-normal leading-tight"
                  [class.text-orange-600/75]="sectionNav.isActive"
                  [class.text-slate-400]="!sectionNav.isActive"
                >
                  {{ section.description }}
                </span>
              </span>
            </a>
          }
        </nav>
      </aside>

      <div class="min-h-96 rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm sm:p-7 lg:p-8">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</section>
