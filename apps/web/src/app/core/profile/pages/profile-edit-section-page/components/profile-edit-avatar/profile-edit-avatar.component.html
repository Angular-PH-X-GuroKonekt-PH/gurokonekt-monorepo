<div class="mb-10 pb-10 border-b border-gray-200">
  <h2 class="text-xl font-bold text-gray-900 mb-6">Profile Picture</h2>

  <div class="flex flex-col items-center gap-5">
    <div class="relative">
      @if (avatarPreview()) {
        <img
          [src]="avatarPreview()"
          alt="Profile preview"
          class="w-40 h-40 rounded-full object-cover border-4 border-orange-500"
        />
        <button
          type="button"
          (click)="removePreview.emit(avatarInput)"
          class="absolute top-1 right-1 flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-sm transition-colors hover:border-red-200 hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-200"
          title="Remove image preview"
          aria-label="Remove image preview"
        >
          <app-icon name="close" class="w-3.5 h-3.5"></app-icon>
        </button>
      } @else if (currentAvatarUrl()) {
        <img
          [src]="currentAvatarUrl()"
          alt="Current profile picture"
          class="w-40 h-40 rounded-full object-cover border-4 border-gray-300"
        />
        <button
          type="button"
          (click)="removeCurrent.emit(avatarInput)"
          class="absolute top-1 right-1 flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-sm transition-colors hover:border-red-200 hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-200"
          title="Remove current picture"
          aria-label="Remove current picture"
        >
          <app-icon name="close" class="w-3.5 h-3.5"></app-icon>
        </button>
      } @else {
        <div class="w-40 h-40 rounded-full bg-gray-200 flex items-center justify-center border-4 border-gray-300">
          <app-icon name="user" class="w-16 h-16 text-gray-400"></app-icon>
        </div>
      }
    </div>

    <div class="flex flex-col items-center gap-2">
      <label
        class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm bg-orange-500 text-white rounded-full hover:bg-orange-600 transition-colors cursor-pointer font-medium"
      >
        <app-icon name="pencil" class="w-3.5 h-3.5"></app-icon>
        <span>Upload Picture</span>
        <input
          #avatarInput
          type="file"
          accept=".jpg,.jpeg,.png"
          (change)="onFileInputChange($event)"
          class="hidden"
        />
      </label>
      <p class="text-xs text-gray-500 text-center">JPG, JPEG, or PNG • Max 5MB</p>
    </div>

    @if (avatarError()) {
      <div class="flex items-center gap-2 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
        <app-icon name="alert-warning" class="w-5 h-5 shrink-0"></app-icon>
        <span>{{ avatarError() }}</span>
      </div>
    }
  </div>
</div>

@if (isCropOpen()) {
  <app-avatar-crop-modal
    [imageFile]="cropSourceFile()"
    [originalFileName]="cropSourceFile()?.name || 'avatar.png'"
    (cropped)="onCropped($event)"
    (cancelled)="onCropCancelled()"
  />
}
