<div
  class="relative flex w-full items-start transition"
  [ngClass]="{
    'bg-orange-50/40': notification().status === unreadStatus,
    'bg-white': notification().status !== unreadStatus,
  }"
>
  <button
    type="button"
    data-notification-body
    (click)="onOpenNotification()"
    class="flex min-w-0 flex-1 items-start gap-3 px-4 py-4 pr-12 text-left transition hover:bg-slate-50"
    [attr.aria-label]="'Open notification: ' + notification().title"
  >
    <span
      class="mt-0.5 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl ring-1"
      [ngClass]="getNotificationIconClasses(notification().type)"
    >
      <app-icon
        [name]="getNotificationIconName(notification().type)"
        [class]="'h-4 w-4'"
      ></app-icon>
    </span>

    <div class="min-w-0 flex-1 space-y-1">
      <div class="flex items-start justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <span
            class="inline-flex rounded-full border px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide"
            [class]="getNotificationTypeClasses(notification().type)"
          >
            {{ getNotificationTypeLabel(notification().type) }}
          </span>

          @if (notification().status === unreadStatus) {
            <span class="h-2.5 w-2.5 rounded-full bg-orange-500"></span>
          }
        </div>

        <span class="shrink-0 pt-1 text-xs text-body">
          {{ notification().createdAt | date: 'MMM d, h:mm a' }}
        </span>
      </div>

      <p class="text-sm font-semibold text-heading">
        {{ notification().title }}
      </p>
      <p class="text-sm leading-5 text-body">
        {{ notification().message }}
      </p>
    </div>
  </button>

  <div class="absolute right-2 top-2" data-notification-menu>
    <button
      type="button"
      (click)="onToggleMenu($event)"
      [disabled]="deleting()"
      class="inline-flex h-8 w-8 items-center justify-center rounded-full text-body hover:bg-slate-100 hover:text-heading focus:outline-none focus:ring-2 focus:ring-orange-200 disabled:cursor-not-allowed disabled:opacity-50"
      [attr.aria-label]="'More actions for ' + notification().title"
      [attr.aria-expanded]="menuOpen()"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 20 20"
        class="h-4 w-4"
        fill="currentColor"
      >
        <circle cx="4" cy="10" r="1.5" />
        <circle cx="10" cy="10" r="1.5" />
        <circle cx="16" cy="10" r="1.5" />
      </svg>
    </button>

    @if (menuOpen()) {
      <div
        class="absolute right-0 top-9 z-30 min-w-36 rounded-base border border-slate-200 bg-white p-1 shadow-lg"
        role="menu"
      >
        @if (notification().status === unreadStatus) {
          <button
            type="button"
            role="menuitem"
            data-notification-mark-read
            (click)="onMarkAsRead($event)"
            class="flex w-full items-center gap-2 rounded px-3 py-2 text-left text-xs font-medium text-body hover:bg-slate-50 hover:text-heading"
            [attr.aria-label]="
              'Mark notification as read: ' + notification().title
            "
          >
            <app-icon name="check-mark" class="h-4 w-4"></app-icon>
            Mark as read
          </button>
        }

        <button
          type="button"
          role="menuitem"
          (click)="onDelete($event)"
          [disabled]="deleting()"
          class="flex w-full items-center gap-2 rounded px-3 py-2 text-left text-xs font-medium text-red-600 hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50"
          [attr.aria-label]="'Delete notification: ' + notification().title"
        >
          <app-icon name="trash" class="h-4 w-4"></app-icon>
          {{ deleting() ? 'Deleting...' : 'Delete' }}
        </button>
      </div>
    }
  </div>
</div>
