<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 py-6"
>
  <div
    data-booking-action-modal
    class="flex max-h-[calc(100vh-3rem)] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-xl"
  >
    <div
      class="flex items-center justify-between border-b border-gray-200 px-6 py-4"
    >
      <h3 class="text-lg font-semibold text-gray-900">Cancel Session</h3>

      <button
        type="button"
        (click)="closed.emit()"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
      >
        <span class="sr-only">Close modal</span>
        &times;
      </button>
    </div>

    <div
      data-modal-body
      class="min-h-0 flex-1 space-y-4 overflow-y-auto px-6 py-4"
    >
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label
            for="cancel-session-date"
            class="mb-2 block text-sm font-medium text-gray-900"
          >
            Session date
          </label>

          <input
            id="cancel-session-date"
            type="date"
            [value]="bookingDate()"
            readonly
            class="block w-full cursor-not-allowed rounded-lg border border-gray-300 bg-gray-100 p-2.5 text-sm text-gray-600"
          />
        </div>

        <div>
          <label
            for="cancel-session-time"
            class="mb-2 block text-sm font-medium text-gray-900"
          >
            Session time
          </label>

          <input
            id="cancel-session-time"
            type="time"
            [value]="bookingTime()"
            readonly
            class="block w-full cursor-not-allowed rounded-lg border border-gray-300 bg-gray-100 p-2.5 text-sm text-gray-600"
          />
        </div>
      </div>

      <p class="text-xs text-gray-500">
        Times shown in {{ displayTimezone() }}
      </p>

      <div>
        <label
          for="cancel-session-link"
          class="mb-2 block text-sm font-medium text-gray-900"
        >
          Session link
        </label>

        <input
          id="cancel-session-link"
          type="text"
          [value]="booking().sessionLink || 'Not provided'"
          readonly
          class="block w-full cursor-not-allowed rounded-lg border border-gray-300 bg-gray-100 p-2.5 text-sm text-gray-600"
        />
      </div>

      <div>
        <label
          for="cancel-mentee-notes"
          class="mb-2 block text-sm font-medium text-gray-900"
        >
          Mentee Notes
        </label>

        <textarea
          id="cancel-mentee-notes"
          rows="3"
          [value]="booking().menteeNotes || 'No notes were provided.'"
          readonly
          class="block w-full cursor-not-allowed resize-none rounded-lg border border-gray-300 bg-gray-100 p-2.5 text-sm text-gray-600"
        ></textarea>
      </div>

      <div>
        <label
          for="cancel-mentor-notes"
          class="mb-2 block text-sm font-medium text-gray-900"
        >
          Mentor Notes
        </label>

        <textarea
          id="cancel-mentor-notes"
          rows="3"
          [ngModel]="mentorNotes()"
          (ngModelChange)="mentorNotes.set($event)"
          placeholder="Add a short cancellation explanation for the mentee..."
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-red-500 focus:ring-red-500"
        ></textarea>
      </div>
    </div>

    <div
      data-modal-footer
      class="flex gap-3 border-t border-gray-200 px-6 py-4"
    >
      <button
        type="button"
        (click)="closed.emit()"
        class="flex-1 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200"
      >
        Close
      </button>

      <button
        type="button"
        (click)="confirmed.emit()"
        [disabled]="submitting()"
        class="relative flex-1 overflow-hidden rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <span [class.opacity-0]="submitting()">Cancel</span>

        @if (submitting()) {
        <span
          class="absolute inset-0 z-10 flex items-center justify-center bg-gray-300/30"
        >
          <span
            class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
          ></span>
        </span>
        }
      </button>
    </div>
  </div>
</div>
