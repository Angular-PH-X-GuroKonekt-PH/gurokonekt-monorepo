<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 py-6"
>
  <div
    data-booking-action-modal
    class="flex max-h-[calc(100vh-3rem)] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-xl"
  >
    <div
      class="flex items-center justify-between border-b border-gray-200 px-6 py-4"
    >
      <h3 class="text-lg font-semibold text-gray-900">Approve Booking</h3>

      <button
        type="button"
        (click)="closed.emit()"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
      >
        <span class="sr-only">Close modal</span>
        &times;
      </button>
    </div>

    <div
      data-modal-body
      class="min-h-0 flex-1 space-y-4 overflow-y-auto px-6 py-4"
    >
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label
            for="approval-session-date"
            class="mb-2 block text-sm font-medium text-gray-900"
          >
            Session date
          </label>

          <input
            id="approval-session-date"
            type="date"
            [ngModel]="sessionDate()"
            (ngModelChange)="sessionDate.set($event)"
            class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-orange-500 focus:ring-orange-500"
          />
        </div>

        <div>
          <label
            for="approval-session-time"
            class="mb-2 block text-sm font-medium text-gray-900"
          >
            Session time
          </label>

          <input
            id="approval-session-time"
            type="time"
            [ngModel]="sessionTime()"
            (ngModelChange)="sessionTime.set($event)"
            class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-orange-500 focus:ring-orange-500"
          />
        </div>
      </div>

      <p class="text-xs text-gray-500">
        Times shown in {{ displayTimezone() }}
      </p>

      <div>
        <label
          for="approval-session-link"
          class="mb-2 block text-sm font-medium text-gray-900"
        >
          Session link
        </label>

        <input
          id="approval-session-link"
          type="url"
          [ngModel]="sessionLink()"
          (ngModelChange)="sessionLink.set($event)"
          placeholder="https://meet.google.com/..."
          [attr.aria-invalid]="isSessionLinkInvalid()"
          [attr.aria-describedby]="isSessionLinkInvalid() ? 'approval-session-link-error' : null"
          class="block w-full rounded-lg border bg-gray-50 p-2.5 text-sm text-gray-900"
          [class]="isSessionLinkInvalid()
                        ? 'border-red-500 focus:border-red-500 focus:ring-red-500'
                        : 'border-gray-300 focus:border-orange-500 focus:ring-orange-500'"
        />

        @if (isSessionLinkInvalid()) {
        <p id="approval-session-link-error" class="mt-1.5 text-sm text-red-600">
          Session link is required.
        </p>
        }
      </div>

      <div>
        <label
          for="approval-mentee-notes"
          class="mb-2 block text-sm font-medium text-gray-900"
        >
          Mentee Notes
        </label>

        <textarea
          id="approval-mentee-notes"
          rows="3"
          [value]="booking().menteeNotes || 'No notes were provided.'"
          readonly
          class="block w-full cursor-not-allowed resize-none rounded-lg border border-gray-300 bg-gray-100 p-2.5 text-sm text-gray-600"
        ></textarea>
      </div>

      <div>
        <label
          for="approval-mentor-notes"
          class="mb-2 block text-sm font-medium text-gray-900"
        >
          Mentor Notes
        </label>

        <textarea
          id="approval-mentor-notes"
          rows="3"
          [ngModel]="mentorNotes()"
          (ngModelChange)="mentorNotes.set($event)"
          placeholder="Add notes or preparation details for the mentee..."
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-orange-500 focus:ring-orange-500"
        ></textarea>
      </div>
    </div>

    <div
      data-modal-footer
      class="flex gap-3 border-t border-gray-200 px-6 py-4"
    >
      <button
        type="button"
        (click)="closed.emit()"
        class="flex-1 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200"
      >
        Close
      </button>

      <button
        type="button"
        (click)="confirmApproval()"
        [disabled]="submitting()"
        class="relative flex-1 overflow-hidden rounded-lg bg-orange-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <span [class.opacity-0]="submitting()">Approve</span>

        @if (submitting()) {
        <span
          class="absolute inset-0 z-10 flex items-center justify-center bg-gray-300/50"
        >
          <span
            class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"
          ></span>
        </span>
        }
      </button>
    </div>
  </div>
</div>
