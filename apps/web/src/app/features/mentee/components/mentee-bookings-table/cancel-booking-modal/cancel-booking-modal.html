<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 py-6"
  role="dialog"
  aria-modal="true"
  aria-labelledby="cancel-booking-title"
>
  <div
    data-booking-action-modal
    class="flex max-h-[calc(100vh-3rem)] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-xl"
  >
    <div
      class="flex items-center justify-between border-b border-gray-200 px-6 py-4"
    >
      <h2 id="cancel-booking-title" class="text-lg font-semibold text-gray-900">
        Cancel booking request?
      </h2>
      <button
        type="button"
        (click)="closed.emit()"
        [disabled]="submitting()"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 disabled:cursor-not-allowed disabled:opacity-50"
        aria-label="Close modal"
      >
        &times;
      </button>
    </div>

    <div
      data-modal-body
      class="min-h-0 flex-1 space-y-4 overflow-y-auto px-6 py-4"
    >
      <div
        class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-2xl text-red-600"
      >
        !
      </div>
      <p class="text-sm leading-6 text-gray-600">
        This will cancel your pending session request with
        <span class="font-semibold text-gray-900">
          {{ booking().mentor?.firstName || 'the mentor' }} {{
          booking().mentor?.lastName || '' }} </span
        >.
      </p>
    </div>

    <div
      data-modal-footer
      class="flex gap-3 border-t border-gray-200 px-6 py-4"
    >
      <button
        type="button"
        (click)="closed.emit()"
        [disabled]="submitting()"
        class="flex-1 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Keep booking
      </button>
      <button
        type="button"
        (click)="confirmed.emit()"
        [disabled]="submitting()"
        class="flex-1 rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ submitting() ? 'Cancelling...' : 'Cancel request' }}
      </button>
    </div>
  </div>
</div>
