<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 py-6"
  role="dialog"
  aria-modal="true"
  aria-labelledby="mentee-review-title"
>
  <div
    data-booking-action-modal
    class="flex max-h-[calc(100vh-3rem)] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-xl"
  >
    <div
      class="flex items-center justify-between border-b border-gray-200 px-6 py-4"
    >
      <h2 id="mentee-review-title" class="text-lg font-semibold text-gray-900">
        Review {{ mentorName() }}
      </h2>
      <button
        type="button"
        (click)="closeModal.emit()"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
        aria-label="Close modal"
      >
        <app-icon name="x-mark" class="h-5 w-5"></app-icon>
      </button>
    </div>

    <div
      data-modal-body
      class="min-h-0 flex-1 space-y-5 overflow-y-auto px-6 py-4"
    >
      <p class="text-sm text-gray-600">
        Share your feedback for this completed session.
      </p>

      <div>
        <label for="rating" class="text-sm font-medium text-gray-700"
          >Rating</label
        >

        <div class="mt-3 flex gap-2">
          @for (value of ratingOptions; track value) {
          <button
            type="button"
            (click)="setRating(value)"
            class="rounded-xl border px-3 py-2 transition"
            [class.border-orange-300]="rating() >= value"
            [class.bg-orange-50]="rating() >= value"
            [class.text-orange-500]="rating() >= value"
            [class.border-slate-200]="rating() < value"
            [class.text-slate-300]="rating() < value"
          >
            <app-icon name="star-filled" class="h-5 w-5"></app-icon>
          </button>
          }
        </div>
      </div>

      <div>
        <label for="comment" class="text-sm font-medium text-gray-700"
          >Comment</label
        >

        <textarea
          id="comment"
          rows="5"
          [maxLength]="maxCommentLength"
          [value]="comment()"
          (input)="onCommentInput($event)"
          placeholder="Write an optional review..."
          class="mt-2 w-full resize-none rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-500"
        ></textarea>
      </div>
    </div>

    <div
      data-modal-footer
      class="flex gap-3 border-t border-gray-200 px-6 py-4"
    >
      <button
        type="button"
        (click)="closeModal.emit()"
        class="flex-1 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="isSubmitting()"
        class="flex-1 rounded-lg bg-orange-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Submitting...' : 'Submit Review' }}
      </button>
    </div>
  </div>
</div>
