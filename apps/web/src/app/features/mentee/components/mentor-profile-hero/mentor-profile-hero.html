<section
  class="relative mt-5 overflow-hidden rounded-3xl bg-linear-to-br from-blue-950 via-blue-900 to-blue-950 p-6 text-white shadow-[0_24px_70px_rgba(15,23,42,0.22)] md:p-8"
>
  <div
    class="pointer-events-none absolute -right-24 -top-28 h-72 w-72 rounded-full bg-orange-500/10 blur-sm"
  ></div>
  <div
    class="pointer-events-none absolute bottom-0 right-20 h-40 w-40 rounded-full bg-white/5 blur-2xl"
  ></div>

  <div
    class="relative flex flex-col gap-7 lg:flex-row lg:items-center lg:justify-between"
  >
    <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
      <img
        [src]="getMentorAvatarUrl()"
        [alt]="mentorFullName()"
        class="h-28 w-28 rounded-2xl object-cover ring-2 ring-white/20 md:h-32 md:w-32"
      />

      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white md:text-4xl">
          {{ mentorFullName() }}
        </h1>

        <p class="mt-1 flex items-center gap-2 text-md font-medium text-blue-100">
         <app-icon name="briefcase" class="h-5 w-5"></app-icon>

          {{ getMentorTitle() }}
        </p>

        @if (getMentorLocation()) {
        <p
          class="mt-1 flex items-center gap-2 text-sm font-medium text-white/75"
        >
          <app-icon name="map-pin" class="h-5 w-5"></app-icon>
          {{ getMentorLocation() }}
        </p>
        }
      </div>
    </div>

    <div class="flex items-center gap-3 lg:justify-end">
      @if (mentorProfile().linkedInUrl) {
      <a
        [href]="mentorProfile().linkedInUrl"
        target="_blank"
        rel="noopener noreferrer"
        class=""
        aria-label="View LinkedIn profile"
      >
        <img src="assets/icons/linkedin.png" alt="" class="h-12 w-12" />
      </a>
      }

      <button
        type="button" 
        disabled
        aria-disabled="true"
        title="Messaging will be available in future updates"
        class="inline-flex h-10   items-center rounded-full border border-white/30 px-5 text-2xs font-bold uppercase tracking-[0.14em] text-white"
      >
        Message
      </button>
    </div>
  </div>
</section>
